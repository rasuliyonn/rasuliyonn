name: Update profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/*.svg"

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: rasuliyonn
          OUT_DIR: assets
        run: python scripts/generate_stats.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rasuliyonn
          outputs: |
            dist/snake.svg?color_snake=#818CF8&color_dots=#0B1120,#1E293B,#334155,#818CF8,#38BDF8

      - name: Move snake into assets
        run: mv dist/snake.svg assets/snake.svg

      - name: Commit assets
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi

          git commit -m "chore: обновить графики профиля"

          # Параллельный прогон мог уйти вперёд — подтягиваем и повторяем.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Запушено с попытки $attempt"
              exit 0
            fi
            echo "Push отклонён — rebase и повтор (попытка $attempt)"
            git pull --rebase --autostash origin main
            sleep 5
          done

          echo "Не удалось запушить после 5 попыток" >&2
          exit 1
