<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Muhammadali — Fullstack разработчик: веб, .NET, Telegram-боты">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#1A1130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <circle cx="1046" cy="96" r="150" fill="#818CF8" fill-opacity="0.20" filter="url(#glow)"/>
    <circle cx="902" cy="288" r="118" fill="#38BDF8" fill-opacity="0.14" filter="url(#glow)"/>
    <circle cx="1130" cy="286" r="96" fill="#C084FC" fill-opacity="0.14" filter="url(#glow)"/>

    <text x="1168" y="228" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace"
          font-size="168" font-weight="700" fill="#FFFFFF" fill-opacity="0.06">&lt;/&gt;</text>

    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <text x="72" y="96" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace"
          font-size="17" letter-spacing="4.5" fill="#7DD3FC" fill-opacity="0.9">FULLSTACK · БОТЫ · АВТОМАТИЗАЦИЯ</text>

    <text x="72" y="184" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
          font-size="78" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Muhammadali</text>

    <rect x="74" y="204" width="196" height="6" rx="3" fill="url(#accent)"/>

    <text x="72" y="248" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
          font-size="21" fill="#9FB0C9">Веб-приложения, .NET-сервисы и Telegram-боты — от идеи до продакшена</text>

    <g font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="15" fill="#CBD5E1">
      <rect x="72"  y="272" width="122" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="88"  y="293">TypeScript</text>
      <rect x="204" y="272" width="77"  height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="220" y="293">React</text>
      <rect x="291" y="272" width="95"  height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="307" y="293">Next.js</text>
      <rect x="396" y="272" width="113" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#C084FC" stroke-opacity="0.45"/>
      <text x="412" y="293">C# / .NET</text>
      <rect x="519" y="272" width="95"  height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#C084FC" stroke-opacity="0.35"/>
      <text x="535" y="293">Node.js</text>
      <rect x="624" y="272" width="86"  height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#C084FC" stroke-opacity="0.35"/>
      <text x="640" y="293">Python</text>
    </g>

    <rect x="0" y="338" width="1200" height="2" fill="url(#fade)"/>
  </g>
</svg>
